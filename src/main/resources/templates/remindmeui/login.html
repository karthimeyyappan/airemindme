<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - Numen</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<!-- Flash prevention — default DARK -->
	
	<link rel="stylesheet" th:href="@{/css/theme.css}">

</head>

<body class="min-h-screen flex items-center justify-center px-4 relative">

	<!-- Background blobs -->
	<div class="fixed inset-0 overflow-hidden pointer-events-none">
		<div class="blob-1 absolute -top-40 -right-40 w-80 h-80 bg-indigo-100 rounded-full opacity-40 blur-3xl"></div>
		<div class="blob-2 absolute -bottom-40 -left-40 w-80 h-80 bg-violet-100 rounded-full opacity-40 blur-3xl"></div>
	</div>



	<div class="w-full max-w-md relative">

		<!-- Logo -->
		<div class="logo-wrap text-center mb-8">
			<div
				class="logo-icon inline-flex items-center justify-center w-16 h-16 rounded-3xl overflow-hidden shadow-lg shadow-indigo-200 mb-4 bg-white">

				<img src="/assets/logo.jpeg" alt="Numen Logo" class="w-full h-full object-cover">

			</div>
			<h1 class="login-title text-2xl font-bold text-gray-900">Welcome back</h1>
			<p class="login-subtitle text-sm text-gray-500 mt-1">Sign in to Numen</p>
		</div>

		<!-- Card -->
		<div class="login-card bg-white rounded-3xl shadow-xl shadow-gray-200/60 border border-gray-100 p-8">
			<form method="post" role="form" th:action="@{/login}">

				<!-- Email -->
				<div class="mb-4">
					<label class="text-sm font-medium text-gray-700 mb-1.5 block">Email Address</label>
					<div class="relative">
						<svg class="input-icon w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"
							fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
						</svg>
						<input type="email" id="username" name="username" placeholder="admin@acmefinancial.com" required
							class="w-full pl-10 pr-4 py-3 rounded-2xl border border-gray-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-gray-400">
					</div>
				</div>

				<!-- Password -->
				<div class="mb-2">
					<label class="text-sm font-medium text-gray-700 mb-1.5 block">Password</label>
					<div class="relative">
						<svg class="input-icon w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"
							fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
						</svg>
						<input type="password" id="password" name="password" placeholder="••••••••" required
							class="w-full pl-10 pr-12 py-3 rounded-2xl border border-gray-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-gray-400">
						<button type="button" id="togglePassBtn"
							class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">
							<svg class="w-4 h-4" id="eyeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
							</svg>
						</button>
					</div>
				</div>

				<!-- Remember + Forgot -->
				<div class="flex items-center justify-between mb-5">
					<label class="flex items-center gap-2 cursor-pointer">
						<input type="checkbox" id="remember" class="w-4 h-4 rounded accent-indigo-600">
						<span class="remember-text text-sm text-gray-600">Remember me</span>
					</label>
					<a href="forgot-password.html" class="forgot-link text-sm text-indigo-600 hover:text-indigo-700 font-medium">Forgot
						password?</a>
				</div>

				<!-- Error box -->
				<div id="loginError"
					class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-100 text-sm text-red-600 text-center">
				</div>

				<!-- Submit -->
				<button type="submit" id="loginBtn"
					class="login-btn w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-semibold text-sm hover:bg-indigo-700 transition shadow-sm shadow-indigo-200 flex items-center justify-center gap-2">
					<span id="loginBtnText">Sign In</span>
					<svg id="loginSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
						<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
						</circle>
						<path class="opacity-75" fill="currentColor"
							d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
						</path>
					</svg>
				</button>

				<!-- Divider -->
				<div class="my-5 flex items-center justify-center gap-3">
					<div class="h-px bg-gray-100 flex-1"></div>
					<span class="text-[10px] font-semibold text-gray-400 tracking-wider uppercase">OR CONTINUE WITH</span>
					<div class="h-px bg-gray-100 flex-1"></div>
				</div>

				<!-- Social Logins -->
				<div class="space-y-3">
					<!-- Google Button -->
					<a href="/oauth2/authorization/google" id="googleBtn"
						class="w-full py-3 rounded-2xl border border-gray-200 bg-white text-gray-700 font-semibold text-sm hover:bg-gray-50 hover:border-gray-300 transition flex items-center justify-center gap-2">
						<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
							<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
							<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
							<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
							<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
						</svg>
						<span>Continue with Google</span>
					</a>

					<!-- Microsoft Button -->
					<button type="button" id="microsoftBtn"
						class="w-full py-3 rounded-2xl border border-gray-200 bg-white text-gray-700 font-semibold text-sm hover:bg-gray-50 hover:border-gray-300 transition flex items-center justify-center gap-2">
						<svg class="w-4 h-4" viewBox="0 0 23 23" fill="none">
							<path d="M0 0h11v11H0z" fill="#f25022"/>
							<path d="M12 0h11v11H12z" fill="#7fba00"/>
							<path d="M0 12h11v11H0z" fill="#00a4ef"/>
							<path d="M12 12h11v11H12z" fill="#ffb900"/>
						</svg>
						<span>Continue with Microsoft</span>
					</button>
				</div>
			</form>

			<!-- Super Admin -->
			<div class="mt-6 pt-5 border-t divider border-gray-100 text-center">
				<p class="soft-text text-sm text-gray-400">Are you a Super Admin?</p>
				<a href="super-admin-login.html"
					class="accent-link text-sm text-indigo-600 font-medium hover:text-indigo-700 mt-0.5 inline-block">
					Access Super Admin Panel →
				</a>
			</div>

			<!-- Register -->
			<div class="mt-4 pt-4 border-t divider border-gray-100 text-center">
				<p class="soft-text text-sm text-gray-500">Don't have an account?</p>
				<a href="register.html"
					class="accent-link text-sm text-indigo-600 font-semibold hover:text-indigo-700 mt-0.5 inline-block">
					Register your business →
				</a>
			</div>
		</div>

	</div>

	<script>
		// ── THEME TOGGLE ──
		function toggleTheme() {
			var cur = document.documentElement.getAttribute('data-theme') || 'dark';
			var next = cur === 'dark' ? 'light' : 'dark';
			document.documentElement.setAttribute('data-theme', next);
			localStorage.setItem('rm_theme', next);
		}

		// ── PASSWORD TOGGLE ──
		function togglePass() {
			var p = document.getElementById('password');
			p.type = p.type === 'password' ? 'text' : 'password';
		}

		// ── TOAST MESSAGE ──
		function showToast(msg, type = 'success') {
			let container = document.getElementById('toastContainer');
			if (!container) {
				container = document.createElement('div');
				container.id = 'toastContainer';
				container.className = 'fixed bottom-5 right-4 z-[100] flex flex-col gap-2';
				document.body.appendChild(container);
			}
			const bg = { success: 'bg-emerald-600', error: 'bg-red-500', info: 'bg-indigo-600' }[type] || 'bg-gray-800';
			const icon = type === 'error'
				? 'M6 18L18 6M6 6l12 12'
				: 'M5 13l4 4L19 7';
			const toast = document.createElement('div');
			toast.className = `${bg} text-white text-sm font-medium px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2 transition-opacity duration-300`;
			toast.innerHTML = `<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${icon}"/></svg>${msg}`;
			container.appendChild(toast);
			setTimeout(() => {
				toast.style.opacity = '0';
				setTimeout(() => toast.remove(), 300);
			}, 3000);
		}

		// ── ERROR AND SUCCESS ALERTS ──
		function showError(message) {
			const errorBox = document.getElementById('loginError');
			if (errorBox) {
				errorBox.textContent = message;
				errorBox.className = "mb-4 p-3 rounded-xl bg-red-50 border border-red-500/20 text-sm text-center block";
			}
		}

		function showSuccess(message) {
			const errorBox = document.getElementById('loginError');
			if (errorBox) {
				errorBox.textContent = message;
				errorBox.className = "mb-4 p-3 rounded-xl bg-emerald-100 border border-emerald-500/20 text-sm text-center block";
			}
		}

		function showComingSoon() {
			showToast("Microsoft Login Coming Soon", "info");
		}

		// ── OAUTH MESSAGES ──
		function handleOAuthMessages() {
			const params = new URLSearchParams(window.location.search);
			if (params.has('error')) {
				const errorVal = params.get('error');
				if (errorVal === 'user_not_found') {
					showError("No account found for this Google email. Please contact your administrator.");
				} else if (errorVal === 'true' || errorVal === '') {
					showError("Incorrect email or password. Please try again.");
				}
			} else if (params.has('logout')) {
				showSuccess("You have been logged out successfully.");
			}
		}

		// ── SUBMIT HANDLER ──
		function handleLoginSubmit(event) {
			const btn = document.getElementById('loginBtn');
			const spinner = document.getElementById('loginSpinner');
			const btnText = document.getElementById('loginBtnText');
			
			if (window.isSubmitting) {
				event.preventDefault();
				return;
			}
			window.isSubmitting = true;
			
			if (spinner) spinner.classList.remove('hidden');
			if (btnText) btnText.textContent = "Signing In...";
			
			setTimeout(() => {
				btn.disabled = true;
			}, 0);
		}

		// ── INITIALIZATION ──
		window.addEventListener('DOMContentLoaded', () => {
			handleOAuthMessages();
			
			const togglePassBtn = document.getElementById('togglePassBtn');
			if (togglePassBtn) {
				togglePassBtn.addEventListener('click', togglePass);
			}
			
			const microsoftBtn = document.getElementById('microsoftBtn');
			if (microsoftBtn) {
				microsoftBtn.addEventListener('click', showComingSoon);
			}

			const loginForm = document.querySelector('form');
			if (loginForm) {
				loginForm.addEventListener('submit', handleLoginSubmit);
			}
		});
	</script>
</body>

</html>
