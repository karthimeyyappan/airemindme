<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions - Numen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50">

  <div th:replace="~{remindmeui/fragments/layout :: sidebar(activePage='settings')}"></div>
  <div th:replace="~{remindmeui/fragments/layout :: mobileNav(activePage='settings')}"></div>

  <div class="md:ml-56 min-h-screen pb-24 md:pb-0 pt-14 md:pt-0">

    <!-- Header -->
    <div class="bg-white border-b border-gray-100 px-4 md:px-6 py-4 sticky top-14 md:top-0 z-20">
      <p class="text-xs text-gray-400 mb-1">
        <a href="home.html" class="hover:text-indigo-600">Home</a> /
        <a href="settings.html" class="hover:text-indigo-600">Settings</a> /
        <span class="text-gray-700">Transactions</span>
      </p>
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-900">Payment Transactions</h1>
        <a href="/referral-transactions.html"
           class="flex items-center gap-2 px-4 py-2 rounded-xl border border-indigo-200 text-indigo-600 text-sm font-semibold hover:bg-indigo-50 transition">
          🎁 Referral Transactions
        </a>
      </div>
    </div>

    <div class="px-4 md:px-6 py-5">

      <!-- Summary Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <p class="text-xs text-gray-400 mb-1">Total Transactions</p>
          <p class="text-3xl font-bold text-gray-900" th:text="${totalCount}">0</p>
          <p class="text-xs text-gray-400 mt-1">All time</p>
        </div>
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <p class="text-xs text-gray-400 mb-1">Successful</p>
          <p class="text-3xl font-bold text-emerald-600" th:text="${successCount}">0</p>
          <p class="text-xs text-gray-400 mt-1">Completed payments</p>
        </div>
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <p class="text-xs text-gray-400 mb-1">Total Paid</p>
          <p class="text-3xl font-bold text-indigo-600"
             th:text="'₹' + ${#numbers.formatDecimal(totalPaid, 1, 2)}">₹0.00</p>
          <p class="text-xs text-gray-400 mt-1">Successful payments only</p>
        </div>
      </div>

      <!-- Filters -->
      <form method="get" action="/transactions.html"
            class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 mb-5">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <div>
            <label class="text-xs font-semibold text-gray-600 mb-1 block">Status</label>
            <select name="status"
                    class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="" th:selected="${selectedStatus == null or selectedStatus == ''}">All Status</option>
              <option value="success" th:selected="${selectedStatus == 'success'}">✅ Success</option>
              <option value="pending" th:selected="${selectedStatus == 'pending'}">🕐 Pending</option>
              <option value="failed" th:selected="${selectedStatus == 'failed'}">❌ Failed</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 mb-1 block">From Date</label>
            <input type="date" name="fromDate" th:value="${fromDate}"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600 mb-1 block">To Date</label>
            <input type="date" name="toDate" th:value="${toDate}"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div class="flex items-end gap-2">
            <button type="submit"
                    class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition">
              Apply Filter
            </button>
            <a href="/transactions.html"
               class="py-2.5 px-4 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition">
              Clear
            </a>
          </div>
        </div>
      </form>

      <!-- Table -->
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden mb-5">
        <div class="px-5 pt-4 pb-3 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-900">
            Transactions
            <span class="text-gray-400 font-normal"
                  th:text="'(' + ${totalElements} + ' total)'"></span>
          </h3>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="bg-gray-50 border-y border-gray-100">
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500">#</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500">Plan</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500">Amount</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500">Status</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 hidden md:table-cell">Method</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 hidden md:table-cell">Gateway ID</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500">Date</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
              <tr th:if="${#lists.isEmpty(transactions)}">
                <td colspan="7" class="px-5 py-12 text-center text-gray-400 text-sm">
                  No transactions found
                </td>
              </tr>
              <tr th:each="tx : ${transactions}" class="hover:bg-gray-50 transition">
                <td class="px-5 py-3 text-sm text-gray-500" th:text="${tx.id}"></td>
                <td class="px-5 py-3">
                  <p class="text-sm font-semibold text-gray-900"
                     th:text="${tx.plan != null ? tx.plan.name : 'N/A'}"></p>
                  <p class="text-xs text-gray-400"
                     th:text="${tx.plan != null ? tx.plan.billingCycle : ''}"></p>
                </td>
                <td class="px-5 py-3">
                  <p class="text-sm font-bold text-gray-900"
                     th:text="'₹' + ${#numbers.formatDecimal(tx.amount, 1, 2)}"></p>
                  <p class="text-xs text-gray-400" th:text="${tx.currency}"></p>
                </td>
                <td class="px-5 py-3">
                  <span th:classappend="${
                    tx.paymentStatus.name() == 'success' ? 'bg-green-100 text-green-700' :
                    tx.paymentStatus.name() == 'pending' ? 'bg-yellow-100 text-yellow-700' :
                    'bg-red-100 text-red-700'}"
                        class="px-2.5 py-1 rounded-full text-[10px] font-semibold capitalize"
                        th:text="${tx.paymentStatus}">
                  </span>
                </td>
                <td class="px-5 py-3 text-sm text-gray-500 hidden md:table-cell"
                    th:text="${tx.paymentMethod ?: 'N/A'}"></td>
                <td class="px-5 py-3 hidden md:table-cell">
                  <p class="text-xs text-gray-500 font-mono"
                     th:text="${tx.gatewayPaymentId ?: '-'}"></p>
                </td>
                <td class="px-5 py-3 text-xs text-gray-400"
                    th:text="${tx.createdAt != null ? #temporals.format(tx.createdAt, 'dd MMM yyyy, hh:mm a') : '-'}"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-between px-5 py-4 border-t border-gray-50"
             th:if="${totalPages > 1}">
          <p class="text-sm text-gray-500">
            Page <span th:text="${currentPage + 1}"></span> of
            <span th:text="${totalPages}"></span>
          </p>
          <div class="flex items-center gap-1">
            <a th:if="${currentPage > 0}"
               th:href="@{/transactions.html(page=${currentPage - 1}, status=${selectedStatus}, fromDate=${fromDate}, toDate=${toDate})}"
               class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
              </svg>
            </a>
            <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
              <a th:if="${i >= currentPage - 2 and i <= currentPage + 2}"
                 th:href="@{/transactions.html(page=${i}, status=${selectedStatus}, fromDate=${fromDate}, toDate=${toDate})}"
                 th:text="${i + 1}"
                 th:classappend="${i == currentPage} ? 'bg-indigo-600 text-white' : 'border border-gray-200 text-gray-600 hover:bg-gray-50'"
                 class="w-8 h-8 flex items-center justify-center rounded-lg text-sm font-medium">
              </a>
            </th:block>
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/transactions.html(page=${currentPage + 1}, status=${selectedStatus}, fromDate=${fromDate}, toDate=${toDate})}"
               class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{remindmeui/fragments/layout :: bottomNav(activePage='settings')}"></div>
</body>
</html>
