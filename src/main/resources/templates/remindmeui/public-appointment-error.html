<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen p-4">
  <div class="max-w-md w-full text-center space-y-6 bg-white border border-gray-100 rounded-3xl shadow-xl p-8">
    <div class="w-16 h-16 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">
      ⚠️
    </div>
    <h1 class="text-2xl font-extrabold text-gray-900" th:text="${errorTitle != null ? errorTitle : 'Appointment Not Found'}">Appointment Not Found</h1>
    <p class="text-sm text-gray-500 leading-relaxed" th:text="${errorMessage != null ? errorMessage : 'The appointment link is invalid or unavailable.'}">The appointment link is invalid or unavailable.</p>
    
    <div class="pt-4">
      <a href="/" class="inline-flex items-center justify-center px-6 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition-all shadow-md">
        Go to Homepage
      </a>
    </div>
  </div>

  <!-- Powered By Numen Fragment -->
  <div th:replace="~{remindmeui/fragments/public-powered-by-numen :: poweredBy}"></div>
</body>
</html>
