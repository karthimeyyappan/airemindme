<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Report - Numen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 4px
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px
        }
    </style>
</head>

<body class="bg-gray-50 pb-28">

    <div class="max-w-4xl mx-auto px-4 md:px-6 pt-6">

        <p class="text-xs text-gray-400 mb-1"><a href="/reports.html" class="hover:text-indigo-600">Reports</a> / <span
                class="text-gray-700">Create Report</span></p>
        <div class="mb-6">
            <h1 class="text-xl font-bold text-gray-900">Create Report</h1>
            <p class="text-sm text-gray-500 mt-0.5">Select a customer, optionally load a template, and fill in the
                report</p>
        </div>

        <!-- STEP 1: CUSTOMER -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-5">
            <label class="text-sm font-semibold text-gray-700 mb-2 block">Customer <span
                    class="text-red-400">*</span></label>
            <div class="relative" id="customerSearchWrap">
                <input id="customerSearchInput" type="text" oninput="onCustomerSearch(this.value)"
                    placeholder="Search by name, mobile or customer ID..."
                    class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div id="customerDropdown"
                    class="hidden absolute z-20 mt-1 w-full bg-white border border-gray-100 rounded-2xl shadow-lg max-h-60 overflow-y-auto">
                </div>
            </div>

            <div id="selectedCustomerCard"
                class="hidden mt-3 flex items-center justify-between bg-indigo-50 border border-indigo-100 rounded-2xl px-4 py-3">
                <div>
                    <p id="selCustName" class="text-sm font-bold text-indigo-900">—</p>
                    <p id="selCustMeta" class="text-xs text-indigo-600 mt-0.5">—</p>
                </div>
                <button onclick="clearCustomer()"
                    class="text-xs text-indigo-500 hover:text-indigo-700 font-semibold">Change</button>
            </div>
        </div>

        <!-- STEP 2: TEMPLATE -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-5">
            <label class="text-sm font-semibold text-gray-700 mb-2 block">Report Template <span
                    class="text-gray-400 text-xs font-normal">(optional)</span></label>
            <div class="relative" id="templateSearchWrap">
                <input id="templateSearchInput" type="text" oninput="onTemplateSearch(this.value)"
                    placeholder="Search template by name..."
                    class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div id="templateDropdown"
                    class="hidden absolute z-20 mt-1 w-full bg-white border border-gray-100 rounded-2xl shadow-lg max-h-60 overflow-y-auto">
                </div>
            </div>

            <div class="flex flex-wrap gap-2 mt-3">
                <button onclick="loadSelectedTemplate()"
                    class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition">Load
                    Template</button>
                <button onclick="createEmptyReport()"
                    class="px-4 py-2.5 rounded-xl border border-gray-200 text-gray-700 text-sm font-semibold hover:bg-gray-50 transition">Create
                    Empty Report</button>
            </div>

            <div id="selectedTemplateBadge"
                class="hidden mt-3 inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-700 text-xs font-semibold">
                <span id="selTemplateName">—</span>
                <button onclick="clearTemplate()" class="text-emerald-500 hover:text-emerald-800">✕</button>
            </div>
        </div>

        <!-- STEP 3: FIELDS -->
        <div id="fieldsSection" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm mb-5">
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
                <div>
                    <h2 id="reportModeTitle" class="text-sm font-bold text-gray-900">Manual Report</h2>
                    <p class="text-xs text-gray-400 mt-0.5">Fill in the values below</p>
                </div>
                <button onclick="addField()"
                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-700 text-xs font-semibold hover:bg-emerald-100 transition">
                    + Add Field
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm min-w-[480px]">
                    <thead>
                        <tr id="fieldsTableHead"
                            class="bg-gray-50 border-b border-gray-100 text-gray-500 text-xs uppercase tracking-wide">
                        </tr>
                    </thead>
                    <tbody id="fieldsTableBody" class="divide-y divide-gray-50"></tbody>
                </table>
            </div>

            <div id="fieldsEmptyState" class="hidden text-center py-10">
                <p class="text-gray-400 text-sm">No fields yet. Click "Add Field" to start.</p>
            </div>
        </div>

    </div>

    <!-- FIXED BOTTOM ACTION BAR -->
    <div id="actionBar"
        class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-3 flex flex-wrap gap-3 justify-end shadow-[0_-4px_12px_rgba(0,0,0,0.04)] z-30">
        <button onclick="saveReport('DRAFT')"
            class="px-5 py-3 rounded-xl border border-indigo-200 text-indigo-600 text-sm font-semibold hover:bg-indigo-50 transition">Save
            Draft</button>
        <button onclick="checkCreditAndSend('SEND')"
            class="px-5 py-3 rounded-xl border border-emerald-200 text-emerald-600 text-sm font-semibold hover:bg-emerald-50 transition">Save
            & Send Customer</button>
        <button onclick="saveReport('COMPLETED')"
            class="px-5 py-3 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition shadow-sm">Save
            & Complete</button>
    </div>

    <script>
        // ============ STATE ============
        let selectedCustomer = null;
        let selectedTemplate = null;
        let pendingTemplate = null;
        let reportFields = [];
        let hasRangeColumn = false;
        let lastCustomerResults = [];
        let lastTemplateResults = [];
        let allTemplates = null;

        // ============ HELPERS ============
        async function api(url, method = 'GET', data = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (data) options.body = JSON.stringify(data);
            const res = await fetch(url, options);
            if (!res.ok) throw new Error('API Error: ' + res.status);
            return res.json();
        }

        function debounce(fn, delay) {
            let t;
            return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
        }

        function escAttr(s) {
            return (s === undefined || s === null ? '' : String(s)).replace(/"/g, '&quot;');
        }

        function getParams() {
            const url = new URL(window.location.href);
            return { templateId: url.searchParams.get('templateId'), patientId: url.searchParams.get('patientId') };
        }

        // ============ CUSTOMER SEARCH ============
        const onCustomerSearch = debounce(async function (query) {
            const dd = document.getElementById('customerDropdown');
            if (!query || query.trim().length < 2) { dd.classList.add('hidden'); dd.innerHTML = ''; return; }
            try {
                const results = await api(`/api/customers/search?query=${encodeURIComponent(query)}`);
                renderCustomerDropdown(results);
            } catch (e) { console.error('Customer search failed', e); }
        }, 300);

        function renderCustomerDropdown(list) {
            lastCustomerResults = list || [];
            const dd = document.getElementById('customerDropdown');
            if (!lastCustomerResults.length) {
                dd.innerHTML = `<div class="px-4 py-3 text-xs text-gray-400">No customers found</div>`;
                dd.classList.remove('hidden');
                return;
            }
            dd.innerHTML = lastCustomerResults.map((c, i) => `
        <button type="button" onclick="selectCustomer(${i})" class="w-full text-left px-4 py-3 hover:bg-indigo-50 border-b border-gray-50 last:border-0">
          <p class="text-sm font-semibold text-gray-800">${c.name || 'Unnamed'}</p>
          <p class="text-xs text-gray-400">${c.mobile || ''}${c.customerId ? ' • ID: ' + c.customerId : ''}</p>
        </button>
      `).join('');
            dd.classList.remove('hidden');
        }

        function selectCustomer(i) { applyCustomer(lastCustomerResults[i]); }

        function applyCustomer(c) {
            selectedCustomer = c;
            document.getElementById('customerSearchInput').value = c.name || '';
            document.getElementById('customerDropdown').classList.add('hidden');
            document.getElementById('selCustName').innerText = c.name || 'Unnamed';
            document.getElementById('selCustMeta').innerText = `${c.mobile || ''}${c.customerId ? ' • ID: ' + c.customerId : ''}`;
            document.getElementById('selectedCustomerCard').classList.remove('hidden');
        }

        function clearCustomer() {
            selectedCustomer = null;
            document.getElementById('customerSearchInput').value = '';
            document.getElementById('selectedCustomerCard').classList.add('hidden');
        }

        // ============ TEMPLATE SEARCH ============
        async function ensureTemplatesLoaded() {
            if (allTemplates) return allTemplates;
            allTemplates = await api('/api/catalog/rtemplates');
            return allTemplates;
        }

        const onTemplateSearch = debounce(async function (query) {
            const dd = document.getElementById('templateDropdown');
            if (!query || !query.trim()) { dd.classList.add('hidden'); dd.innerHTML = ''; return; }
            try {
                const all = await ensureTemplatesLoaded();
                const filtered = all.filter(t => (t.title || '').toLowerCase().includes(query.toLowerCase()));
                renderTemplateDropdown(filtered);
            } catch (e) { console.error('Template search failed', e); }
        }, 250);

        function renderTemplateDropdown(list) {
            lastTemplateResults = list;
            const dd = document.getElementById('templateDropdown');
            if (!list.length) {
                dd.innerHTML = `<div class="px-4 py-3 text-xs text-gray-400">No templates found</div>`;
                dd.classList.remove('hidden');
                return;
            }
            dd.innerHTML = list.map((t, i) => `
        <button type="button" onclick="pickTemplate(${i})" class="w-full text-left px-4 py-3 hover:bg-indigo-50 border-b border-gray-50 last:border-0">
          <p class="text-sm font-semibold text-gray-800">${t.title}</p>
          <p class="text-xs text-gray-400">${t.category || ''}</p>
        </button>
      `).join('');
            dd.classList.remove('hidden');
        }

        function pickTemplate(i) {
            pendingTemplate = lastTemplateResults[i];
            document.getElementById('templateSearchInput').value = pendingTemplate.title;
            document.getElementById('templateDropdown').classList.add('hidden');
        }

        async function loadSelectedTemplate() {
            if (!pendingTemplate) { alert('Please search and select a template first'); return; }
            try {
                const full = await api(`/api/catalog/rtemplates/${pendingTemplate.id}`);
                applyTemplate(full);
            } catch (e) { alert('Failed to load template'); }
        }

        function applyTemplate(t) {
            selectedTemplate = t;
            const cols = t.columns || [];
            hasRangeColumn = cols.some(c => c.referenceRange || c.range || c.description || c.hint);
            reportFields = cols.map(c => ({
                fieldName: c.fieldName || c.name || c.test || '',
                value: '',
                range: c.referenceRange || c.range || c.description || c.hint || '',
                status: 'Normal'
            }));
            document.getElementById('selTemplateName').innerText = t.title;
            document.getElementById('selectedTemplateBadge').classList.remove('hidden');
            document.getElementById('reportModeTitle').innerText = t.title;
            showFieldsSection();
            renderFieldsTable();
        }

        function clearTemplate() {
            selectedTemplate = null;
            pendingTemplate = null;
            document.getElementById('templateSearchInput').value = '';
            document.getElementById('selectedTemplateBadge').classList.add('hidden');
        }

        function createEmptyReport() {
            selectedTemplate = null;
            pendingTemplate = null;
            hasRangeColumn = false;
            reportFields = [];
            document.getElementById('templateSearchInput').value = '';
            document.getElementById('selectedTemplateBadge').classList.add('hidden');
            document.getElementById('reportModeTitle').innerText = 'Manual Report';
            showFieldsSection();
            renderFieldsTable();
        }

        function showFieldsSection() {
            document.getElementById('fieldsSection').classList.remove('hidden');
            document.getElementById('actionBar').classList.remove('hidden');
        }

        // ============ FIELDS TABLE ============
        function renderFieldsTable() {
            const thead = document.getElementById('fieldsTableHead');
            const tbody = document.getElementById('fieldsTableBody');
            const empty = document.getElementById('fieldsEmptyState');

            thead.innerHTML = hasRangeColumn
                ? `<th class="px-5 py-3 text-left">Field Name</th><th class="px-5 py-3 text-left">Value</th><th class="px-5 py-3 text-left">Range</th><th class="px-5 py-3 text-left">Status</th><th class="px-5 py-3 text-right w-28">Actions</th>`
                : `<th class="px-5 py-3 text-left">Field Name</th><th class="px-5 py-3 text-left">Value</th><th class="px-5 py-3 text-right w-28">Actions</th>`;

            if (!reportFields.length) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            tbody.innerHTML = reportFields.map((f, i) => `
        <tr>
          <td class="px-5 py-2.5">
            <input type="text" value="${escAttr(f.fieldName)}" oninput="updateField(${i},'fieldName',this.value)"
              placeholder="Field name" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </td>
          <td class="px-5 py-2.5">
            <input type="text" value="${escAttr(f.value)}" oninput="updateField(${i},'value',this.value)"
              placeholder="Enter value" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </td>
          ${hasRangeColumn ? `
          <td class="px-5 py-2.5">
            <input type="text" value="${escAttr(f.range)}" oninput="updateField(${i},'range',this.value)"
              placeholder="-" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-sm text-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </td>
          <td class="px-5 py-2.5">
            <select onchange="updateField(${i},'status',this.value)" class="px-3 py-2 rounded-xl border border-gray-200 text-sm">
              <option ${f.status === 'Normal' ? 'selected' : ''}>Normal</option>
              <option ${f.status === 'High' ? 'selected' : ''}>High</option>
              <option ${f.status === 'Low' ? 'selected' : ''}>Low</option>
            </select>
          </td>` : ''}
          <td class="px-5 py-2.5 text-right whitespace-nowrap">
            <button onclick="moveField(${i},-1)" title="Move up" class="text-gray-400 hover:text-indigo-600 px-1">↑</button>
            <button onclick="moveField(${i},1)" title="Move down" class="text-gray-400 hover:text-indigo-600 px-1">↓</button>
            <button onclick="deleteField(${i})" title="Delete" class="text-red-400 hover:text-red-600 px-1">✕</button>
          </td>
        </tr>
      `).join('');
        }

        function updateField(i, key, val) { reportFields[i][key] = val; }

        function addField() {
            reportFields.push({ fieldName: '', value: '', range: '', status: 'Normal' });
            renderFieldsTable();
        }

        function deleteField(i) {
            reportFields.splice(i, 1);
            renderFieldsTable();
        }

        function moveField(i, dir) {
            const j = i + dir;
            if (j < 0 || j >= reportFields.length) return;
            [reportFields[i], reportFields[j]] = [reportFields[j], reportFields[i]];
            renderFieldsTable();
        }

        // ============ SAVE ============
        async function checkCreditAndSend(action) {
            if (action !== 'SEND') {
                saveReport(action);
                return;
            }
            try {
                const res = await fetch('/api/accounts/credit-status');
                const data = await res.json();

                if (data.planExpired || !data.hasActivePlan) {
                    showReportLock('plan_expired');
                    return;
                }
                if (data.balance <= 0) {
                    showReportLock('no_credits');
                    return;
                }
                saveReport(action);
            } catch (e) {
                saveReport(action);
            }
        }

        function showReportLock(reason) {
            const isExpired = reason === 'plan_expired';
            const existing = document.getElementById('reportLockOverlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.id = 'reportLockOverlay';
            overlay.className = 'fixed inset-0 z-[999] flex items-center justify-center bg-black/40 backdrop-blur-sm';
            overlay.innerHTML = `
                <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 text-center shadow-2xl">
                    <div class="w-16 h-16 rounded-full ${isExpired ? 'bg-red-100' : 'bg-orange-100'} 
                        flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 ${isExpired ? 'text-red-500' : 'text-orange-500'}" 
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-2">
                        ${isExpired ? '⛔ Plan Expired' : '💳 No WhatsApp Credits'}
                    </h3>
                    <p class="text-sm text-gray-500 mb-6">
                        ${isExpired
                            ? 'Your plan has expired. Upgrade to continue sending reports via WhatsApp.'
                            : 'You have 0 WhatsApp credits. Buy credits to send this report.'}
                    </p>
                    <div class="flex flex-col gap-2">
                        <a href="/settings.html"
                           class="px-6 py-3 rounded-2xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition">
                            🚀 Upgrade Plan
                        </a>
                        <button onclick="document.getElementById('reportLockOverlay').remove(); saveReport('COMPLETED')"
                            class="px-6 py-3 rounded-2xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition">
                            💾 Save Without Sending
                        </button>
                        <button onclick="document.getElementById('reportLockOverlay').remove()"
                            class="px-6 py-3 rounded-2xl text-gray-400 text-sm">
                            Cancel
                        </button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
        }

        async function saveReport(action) {
            if (!selectedCustomer) { alert('Please select a customer first'); return; }
            if (!reportFields.length) { alert('Please add at least one field'); return; }

            let status = 'Draft';
            let notifyCustomer = false;
            if (action === 'COMPLETED') status = 'Completed';
            if (action === 'SEND') { status = 'Completed'; notifyCustomer = true; }

            const payload = {
                patientId: selectedCustomer.id,
                templateId: selectedTemplate ? selectedTemplate.id : null,
                status: status,
                notifyCustomer: notifyCustomer,
                fields: JSON.stringify(reportFields)
            };

            try {
                await api('/api/reports', 'POST', payload);
                alert('Report saved successfully');
                window.location.href = '/reports.html';
            } catch (e) {
                alert('Failed to save report: ' + e.message);
            }
        }

        // ============ INIT ============
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#customerSearchWrap')) document.getElementById('customerDropdown').classList.add('hidden');
            if (!e.target.closest('#templateSearchWrap')) document.getElementById('templateDropdown').classList.add('hidden');
        });

        (async function init() {
            const { templateId, patientId } = getParams();
            if (patientId) {
                try { applyCustomer(await api(`/api/customers/${patientId}`)); }
                catch (e) { console.error('Failed to preload customer', e); }
            }
            if (templateId) {
                try { applyTemplate(await api(`/api/catalog/rtemplates/${templateId}`)); }
                catch (e) { console.error('Failed to preload template', e); }
            }
        })();
    </script>

</body>

</html>
