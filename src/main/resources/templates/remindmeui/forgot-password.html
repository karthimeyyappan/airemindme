<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Forgot Password - Numen</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body class="min-h-screen flex items-center justify-center px-4 relative">

	<!-- Background blobs -->
	<div class="fixed inset-0 overflow-hidden pointer-events-none">
		<div class="blob-1 absolute -top-40 -right-40 w-80 h-80 bg-indigo-100 rounded-full opacity-40 blur-3xl"></div>
		<div class="blob-2 absolute -bottom-40 -left-40 w-80 h-80 bg-violet-100 rounded-full opacity-40 blur-3xl"></div>
	</div>

	<div class="w-full max-w-md relative">

		<!-- Logo -->
		<div class="logo-wrap text-center mb-8">
			<div class="logo-icon inline-flex items-center justify-center w-16 h-16 rounded-3xl overflow-hidden shadow-lg shadow-indigo-200 mb-4 bg-white">
				<img src="/assets/logo.jpeg" alt="Numen Logo" class="w-full h-full object-cover">
			</div>
			<h1 class="login-title text-2xl font-bold text-gray-900">Reset your password</h1>
			<p class="login-subtitle text-sm text-gray-500 mt-1">We will send you reset instructions</p>
		</div>

		<!-- Card -->
		<div class="login-card bg-white rounded-3xl shadow-xl shadow-gray-200/60 border border-gray-100 p-8">
			<form id="forgotPasswordForm">

				<!-- Message box -->
				<div id="messageBox" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

				<!-- Email -->
				<div class="mb-5">
					<label class="text-sm font-medium text-gray-700 mb-1.5 block">Email Address</label>
					<div class="relative">
						<svg class="input-icon w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"
							fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
						</svg>
						<input type="email" id="email" name="email" placeholder="enter your email" required
							class="w-full pl-10 pr-4 py-3 rounded-2xl border border-gray-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-gray-400">
					</div>
				</div>

				<!-- Submit -->
				<button type="submit" id="resetBtn"
					class="login-btn w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-semibold text-sm hover:bg-indigo-700 transition shadow-sm shadow-indigo-200 flex items-center justify-center gap-2">
					<span id="resetBtnText">Send Reset Link</span>
					<svg id="resetSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
						<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
						</circle>
						<path class="opacity-75" fill="currentColor"
							d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
						</path>
					</svg>
				</button>
			</form>

			<!-- Back to Login -->
			<div class="mt-6 pt-5 border-t divider border-gray-100 text-center">
				<a href="login.html"
					class="accent-link text-sm text-indigo-600 font-semibold hover:text-indigo-700 mt-0.5 inline-block">
					← Back to Sign In
				</a>
			</div>
		</div>

	</div>

	<script>
		// ── ERROR AND SUCCESS ALERTS ──
		function showError(message) {
			const box = document.getElementById('messageBox');
			if (box) {
				box.textContent = message;
				box.className = "mb-4 p-3 rounded-xl bg-red-50 border border-red-500/20 text-sm text-red-600 text-center block";
				box.classList.remove('hidden');
			}
		}

		// ── THEME TOGGLE (Checks system config) ──
		const savedTheme = localStorage.getItem('rm_theme');
		if (savedTheme) {
			document.documentElement.setAttribute('data-theme', savedTheme);
		} else {
			document.documentElement.setAttribute('data-theme', 'dark');
		}

		function showSuccess(message) {
			const box = document.getElementById('messageBox');
			if (box) {
				box.textContent = message;
				box.className = "mb-4 p-3 rounded-xl bg-emerald-100 border border-emerald-500/20 text-sm text-emerald-600 text-center block";
				box.classList.remove('hidden');
			}
		}

		// ── SUBMIT HANDLER ──
		async function handleForgotPasswordSubmit(event) {
			event.preventDefault();
			
			const emailInput = document.getElementById('email');
			const email = emailInput.value.trim();
			if (!email) return;

			const btn = document.getElementById('resetBtn');
			const spinner = document.getElementById('resetSpinner');
			const btnText = document.getElementById('resetBtnText');
			
			if (window.isSubmitting) return;
			window.isSubmitting = true;
			
			btn.disabled = true;
			if (spinner) spinner.classList.remove('hidden');
			if (btnText) btnText.textContent = "Sending Link...";
			
			// Hide message boxes
			const box = document.getElementById('messageBox');
			if (box) box.classList.add('hidden');

			try {
				const response = await fetch('/api/auth/forgot-password', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({ email: email })
				});
				
				if (response.ok) {
					showSuccess("Password reset instructions have been sent to your email.");
					emailInput.value = "";
				} else {
					const text = await response.text();
					showError(text || "Account not found.");
				}
			} catch (err) {
				console.error(err);
				showError("An unexpected error occurred. Please try again later.");
			} finally {
				window.isSubmitting = false;
				btn.disabled = false;
				if (spinner) spinner.classList.add('hidden');
				if (btnText) btnText.textContent = "Send Reset Link";
			}
		}

		// ── INITIALIZATION ──
		window.addEventListener('DOMContentLoaded', () => {
			const form = document.getElementById('forgotPasswordForm');
			if (form) {
				form.addEventListener('submit', handleForgotPasswordSubmit);
			}
		});
	</script>
</body>

</html>
