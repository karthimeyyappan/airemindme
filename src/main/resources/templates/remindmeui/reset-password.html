<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reset Password - Numen</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center px-4 relative bg-gray-50">

	<!-- Background blobs -->
	<div class="fixed inset-0 overflow-hidden pointer-events-none">
		<div class="absolute -top-40 -right-40 w-80 h-80 bg-indigo-100 rounded-full opacity-40 blur-3xl"></div>
		<div class="absolute -bottom-40 -left-40 w-80 h-80 bg-violet-100 rounded-full opacity-40 blur-3xl"></div>
	</div>

	<div class="w-full max-w-md relative">

		<!-- Logo -->
		<div class="text-center mb-8">
			<div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl overflow-hidden shadow-lg shadow-indigo-200 mb-4 bg-white">
				<img src="/assets/logo.jpeg" alt="Numen Logo" class="w-full h-full object-cover">
			</div>
			<h1 class="text-2xl font-bold text-gray-900">Set a new password</h1>
			<p class="text-sm text-gray-500 mt-1">Choose something strong and memorable</p>
		</div>

		<!-- Card -->
		<div class="bg-white rounded-3xl shadow-xl shadow-gray-200/60 border border-gray-100 p-8">
			<form id="resetPasswordForm">

				<!-- Message box -->
				<div id="messageBox" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

				<!-- New Password -->
				<div class="mb-5">
					<label class="text-sm font-medium text-gray-700 mb-1.5 block">New Password</label>
					<div class="relative">
						<svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"
							fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
						</svg>
						<input type="password" id="newPassword" placeholder="Enter new password" required
							class="w-full pl-10 pr-10 py-3 rounded-2xl border border-gray-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-gray-400">
						<button type="button" onclick="togglePassword('newPassword', 'eyeIcon1')"
							class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
							<svg id="eyeIcon1" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
							</svg>
						</button>
					</div>
					<!-- Password strength bar -->
					<div class="mt-2">
						<div class="flex gap-1">
							<div id="bar1" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors duration-300"></div>
							<div id="bar2" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors duration-300"></div>
							<div id="bar3" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors duration-300"></div>
							<div id="bar4" class="h-1 flex-1 rounded-full bg-gray-200 transition-colors duration-300"></div>
						</div>
						<p id="strengthText" class="text-xs text-gray-400 mt-1"></p>
					</div>
				</div>

				<!-- Confirm Password -->
				<div class="mb-6">
					<label class="text-sm font-medium text-gray-700 mb-1.5 block">Confirm Password</label>
					<div class="relative">
						<svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"
							fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
						</svg>
						<input type="password" id="confirmPassword" placeholder="Re-enter new password" required
							class="w-full pl-10 pr-10 py-3 rounded-2xl border border-gray-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-gray-400">
						<button type="button" onclick="togglePassword('confirmPassword', 'eyeIcon2')"
							class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
							<svg id="eyeIcon2" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
							</svg>
						</button>
					</div>
					<p id="matchText" class="text-xs mt-1 hidden"></p>
				</div>

				<!-- Submit -->
				<button type="submit" id="resetBtn"
					class="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-semibold text-sm hover:bg-indigo-700 transition shadow-sm shadow-indigo-200 flex items-center justify-center gap-2">
					<span id="resetBtnText">Update Password</span>
					<svg id="resetSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
						<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
						<path class="opacity-75" fill="currentColor"
							d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
						</path>
					</svg>
				</button>
			</form>

			<!-- Back to Login -->
			<div class="mt-6 pt-5 border-t border-gray-100 text-center">
				<a href="/login.html"
					class="text-sm text-indigo-600 font-semibold hover:text-indigo-700 mt-0.5 inline-block">
					← Back to Sign In
				</a>
			</div>
		</div>
	</div>

	<script>
		// ── TOGGLE PASSWORD VISIBILITY ──
		function togglePassword(fieldId, iconId) {
			const field = document.getElementById(fieldId);
			const icon = document.getElementById(iconId);
			const isHidden = field.type === 'password';
			field.type = isHidden ? 'text' : 'password';
			icon.style.opacity = isHidden ? '1' : '0.4';
		}

		// ── PASSWORD STRENGTH ──
		document.getElementById('newPassword').addEventListener('input', function () {
			const val = this.value;
			const bars = ['bar1', 'bar2', 'bar3', 'bar4'];
			const strengthText = document.getElementById('strengthText');
			let score = 0;

			if (val.length >= 8) score++;
			if (/[A-Z]/.test(val)) score++;
			if (/[0-9]/.test(val)) score++;
			if (/[^A-Za-z0-9]/.test(val)) score++;

			const colors = ['bg-red-400', 'bg-orange-400', 'bg-yellow-400', 'bg-green-500'];
			const labels = ['Weak', 'Fair', 'Good', 'Strong'];

			bars.forEach((id, i) => {
				const el = document.getElementById(id);
				el.className = 'h-1 flex-1 rounded-full transition-colors duration-300 ';
				el.className += i < score ? colors[score - 1] : 'bg-gray-200';
			});

			strengthText.textContent = val.length > 0 ? labels[score - 1] || '' : '';
			strengthText.className = 'text-xs mt-1 ' + (score <= 1 ? 'text-red-400' : score === 2 ? 'text-orange-400' : score === 3 ? 'text-yellow-500' : 'text-green-500');
		});

		// ── PASSWORD MATCH CHECK ──
		document.getElementById('confirmPassword').addEventListener('input', function () {
			const pw = document.getElementById('newPassword').value;
			const matchText = document.getElementById('matchText');
			matchText.classList.remove('hidden');
			if (this.value === pw) {
				matchText.textContent = '✓ Passwords match';
				matchText.className = 'text-xs mt-1 text-green-500';
			} else {
				matchText.textContent = '✗ Passwords do not match';
				matchText.className = 'text-xs mt-1 text-red-500';
			}
		});

		// ── ALERTS ──
		function showError(message) {
			const box = document.getElementById('messageBox');
			box.textContent = message;
			box.className = "mb-4 p-3 rounded-xl bg-red-50 border border-red-500/20 text-sm text-red-600 text-center block";
			box.classList.remove('hidden');
		}

		function showSuccess(message) {
			const box = document.getElementById('messageBox');
			box.textContent = message;
			box.className = "mb-4 p-3 rounded-xl bg-emerald-100 border border-emerald-500/20 text-sm text-emerald-600 text-center block";
			box.classList.remove('hidden');
		}

		// ── GET TOKEN FROM URL ──
		function getTokenFromUrl() {
			const params = new URLSearchParams(window.location.search);
			return params.get('token');
		}

		// ── SUBMIT HANDLER ──
		async function handleResetPasswordSubmit(event) {
			event.preventDefault();

			const token = getTokenFromUrl();
			if (!token) {
				showError("Invalid or missing reset token. Please request a new link.");
				return;
			}

			const password = document.getElementById('newPassword').value.trim();
			const confirm = document.getElementById('confirmPassword').value.trim();

			if (!password || password.length < 8) {
				showError("Password must be at least 8 characters.");
				return;
			}

			if (password !== confirm) {
				showError("Passwords do not match.");
				return;
			}

			const btn = document.getElementById('resetBtn');
			const spinner = document.getElementById('resetSpinner');
			const btnText = document.getElementById('resetBtnText');

			if (window.isSubmitting) return;
			window.isSubmitting = true;

			btn.disabled = true;
			spinner.classList.remove('hidden');
			btnText.textContent = "Updating...";
			document.getElementById('messageBox').classList.add('hidden');

			try {
				const response = await fetch('/api/auth/reset-password', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ token, password })
				});

				if (response.ok) {
					showSuccess("Password updated! Redirecting to login...");
					setTimeout(() => window.location.href = '/login.html', 2500);
				} else {
					const text = await response.text();
					showError(text || "Failed to reset password. The link may have expired.");
				}
			} catch (err) {
				console.error(err);
				showError("An unexpected error occurred. Please try again.");
			} finally {
				window.isSubmitting = false;
				btn.disabled = false;
				spinner.classList.add('hidden');
				btnText.textContent = "Update Password";
			}
		}

		// ── INIT ──
		window.addEventListener('DOMContentLoaded', () => {
			const token = getTokenFromUrl();
			if (!token) {
				showError("No reset token found. Please use the link from your email.");
			}
			const form = document.getElementById('resetPasswordForm');
			if (form) form.addEventListener('submit', handleResetPasswordSubmit);
		});
	</script>
</body>
</html>
