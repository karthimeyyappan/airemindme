<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>No Account Associated - Numen</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body class="min-h-screen flex items-center justify-center px-4 relative">

	<!-- Background blobs -->
	<div class="fixed inset-0 overflow-hidden pointer-events-none">
		<div class="blob-1 absolute -top-40 -right-40 w-80 h-80 bg-indigo-100 rounded-full opacity-40 blur-3xl"></div>
		<div class="blob-2 absolute -bottom-40 -left-40 w-80 h-80 bg-violet-100 rounded-full opacity-40 blur-3xl"></div>
	</div>

	<div class="w-full max-w-md relative">

		<!-- Logo -->
		<div class="logo-wrap text-center mb-8">
			<div class="logo-icon inline-flex items-center justify-center w-16 h-16 rounded-3xl overflow-hidden shadow-lg shadow-indigo-200 mb-4 bg-white">
				<img src="/assets/logo.jpeg" alt="Numen Logo" class="w-full h-full object-cover">
			</div>
			<h1 class="login-title text-2xl font-bold text-gray-900">Account Status</h1>
			<p class="login-subtitle text-sm text-gray-500 mt-1">Verification Required</p>
		</div>

		<!-- Card -->
		<div class="login-card bg-white rounded-3xl shadow-xl shadow-gray-200/60 border border-gray-100 p-8 text-center flex flex-col items-center">
			
			<!-- Animated loading spinner / status graphic -->
			<div class="relative w-20 h-20 mb-6 flex items-center justify-center">
				<div class="absolute inset-0 rounded-full border-4 border-indigo-100 animate-pulse"></div>
				<div class="absolute inset-0 rounded-full border-t-4 border-indigo-600 animate-spin"></div>
				<!-- Exclamation SVG -->
				<svg class="w-8 h-8 text-indigo-600 z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
				</svg>
			</div>

			<!-- Status Card / Message -->
			<div class="mb-8">
				<h2 class="text-lg font-bold text-gray-900 mb-2">Access Restricted</h2>
				<p class="text-sm text-gray-500 leading-relaxed">
					No account is associated with this Google account.
				</p>
			</div>

			<!-- Action buttons -->
			<div class="w-full flex flex-col gap-3">
				<a href="mailto:support@numencrm.com" 
					class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition text-center shadow-sm shadow-indigo-200 flex items-center justify-center gap-2">
					<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
					</svg>
					Contact Administrator
				</a>
				
				<form action="/logout" method="POST" class="w-full">
					<button type="submit" 
						class="w-full py-3.5 rounded-2xl border border-gray-200 bg-white text-gray-700 font-semibold text-sm hover:bg-gray-50 hover:border-gray-300 transition flex items-center justify-center gap-2">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
						</svg>
						Logout
					</button>
				</form>
			</div>
		</div>

	</div>

	<script>
		// ── THEME TOGGLE (Checks system config) ──
		const savedTheme = localStorage.getItem('rm_theme');
		if (savedTheme) {
			document.documentElement.setAttribute('data-theme', savedTheme);
		} else {
			document.documentElement.setAttribute('data-theme', 'dark');
		}
	</script>
</body>

</html>
