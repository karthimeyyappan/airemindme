<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Management - Numen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <div th:replace="~{remindmeui/fragments/layout :: sidebar(activePage='settings')}"></div>
  <div th:replace="~{remindmeui/fragments/layout :: mobileNav(activePage='settings')}"></div>

  <div class="md:ml-56 min-h-screen pb-24 md:pb-0 pt-14 md:pt-0">
    <!-- Header -->
    <div class="bg-white border-b border-gray-100 px-4 md:px-6 py-4 sticky top-14 md:top-0 z-20">
      <p class="text-xs text-gray-400 mb-1">
        <a href="home.html" class="hover:text-indigo-600 transition">Home</a> /
        <a href="settings.html" class="hover:text-indigo-600 transition">Settings</a> /
        <span class="text-gray-700">Subscription</span>
      </p>
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-900">Subscription & Plans</h1>
        <a href="settings.html"
           class="flex items-center gap-2 px-4 py-2 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition">
          ← Back to Settings
        </a>
      </div>
    </div>

    <div class="px-4 md:px-6 py-5">
      
      <div id="loader" class="flex flex-col items-center justify-center py-20">
        <svg class="animate-spin h-8 w-8 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-sm text-gray-500 font-medium">Loading subscription details...</p>
      </div>

      <div id="subscriptionContent" class="hidden">
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          
          <!-- Card 1: Current Plan -->
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex flex-col justify-between">
            <div>
              <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-2">Current Plan</p>
              <div class="flex items-center gap-3 mb-4">
                <h2 id="planName" class="text-2xl font-bold text-gray-900">Loading...</h2>
                <span id="planStatus" class="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-gray-100 text-gray-600">...</span>
              </div>
              <div class="space-y-2 mb-6">
                <div class="flex items-center justify-between">
                  <span class="text-sm text-gray-500 font-medium">Billing Cycle</span>
                  <span id="planCycle" class="text-sm font-bold text-gray-900 capitalize">N/A</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-sm text-gray-500 font-medium">Expiry Date</span>
                  <span id="planExpiry" class="text-sm font-bold text-gray-900">N/A</span>
                </div>
              </div>
            </div>
            <div>
              <button id="cardUpgradeBtn" onclick="scrollToPlans()" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition">
                Upgrade Plan
              </button>
            </div>
          </div>

          <!-- Card 2: Usage -->
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
            <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-4">Usage</p>
            
            <!-- WhatsApp Credits -->
            <div class="mb-5">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-sm font-semibold text-gray-900">WhatsApp Credits</span>
                <span class="text-xs text-gray-500"><span id="waUsed" class="font-bold text-gray-900">0</span> used</span>
              </div>
              <div class="w-full bg-gray-100 rounded-full h-2 mb-1.5">
                <div id="waProgress" class="bg-indigo-600 h-2 rounded-full" style="width: 0%"></div>
              </div>
              <p class="text-xs text-gray-500 text-right"><span id="waRemaining" class="font-bold text-gray-900">0</span> remaining</p>
            </div>

            <!-- Customer Usage -->
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-sm font-semibold text-gray-900">Customer Capacity</span>
                <span class="text-xs text-gray-500"><span id="custUsed" class="font-bold text-gray-900">0</span> used</span>
              </div>
              <div class="w-full bg-gray-100 rounded-full h-2 mb-1.5">
                <div id="custProgress" class="bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
              </div>
              <p class="text-xs text-gray-500 text-right"><span id="custRemaining" class="font-bold text-gray-900">0</span> remaining</p>
            </div>
          </div>
        </div>

        <!-- Available Plans Header & Toggle -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4" id="plansSection">
          <h3 class="text-lg font-bold text-gray-900">Available Plans</h3>
          
          <div class="inline-flex rounded-xl bg-gray-100 p-1">
            <button id="toggleHalfYearly" onclick="setBillingCycle('half_yearly')" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-gray-500 hover:text-gray-900 transition">
              Half Yearly
            </button>
            <button id="toggleYearly" onclick="setBillingCycle('yearly')" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-white text-gray-900 shadow-sm transition">
              Yearly
            </button>
          </div>
        </div>

        <!-- Plans Grid -->
        <div id="plansGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Rendered dynamically -->
        </div>

      </div>
    </div>
  </div>

  <div th:replace="~{remindmeui/fragments/layout :: bottomNav(activePage='settings')}"></div>

  <script>
    let globalPlans = [];
    let currentPlanData = null;
    let selectedCycle = 'yearly';

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch('/api/account/subscription');
        if (!res.ok) throw new Error("Failed to load subscription data");
        
        const data = await res.json();
        currentPlanData = data;
        globalPlans = data.availablePlans || [];
        
        renderSummary(data);
        setBillingCycle('yearly'); // renders plans
        
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('subscriptionContent').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        document.getElementById('loader').innerHTML = `<p class="text-red-500 text-sm font-medium">Error loading subscription data.</p>`;
      }
    });

    function scrollToPlans() {
      document.getElementById('plansSection').scrollIntoView({ behavior: 'smooth' });
    }

    function renderSummary(data) {
      // 1. Current Plan Card
      const pName = data.currentPlan ? data.currentPlan.name : "No Active Plan";
      document.getElementById('planName').textContent = pName;
      
      const bCycle = data.currentPlan && data.currentPlan.billingCycle ? data.currentPlan.billingCycle.replace('_', ' ') : "N/A";
      document.getElementById('planCycle').textContent = bCycle;
      
      const statusEl = document.getElementById('planStatus');
      statusEl.textContent = data.status;
      if (data.status === 'Active') {
        statusEl.className = 'px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-green-100 text-green-700';
      } else {
        statusEl.className = 'px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-red-100 text-red-700';
      }

      if (data.expiryDate) {
        const d = new Date(data.expiryDate);
        document.getElementById('planExpiry').textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      } else {
        document.getElementById('planExpiry').textContent = "N/A";
      }

      const isTrialOrExpired = !data.currentPlan || data.currentPlan.isTrial || data.status === 'Expired';
      document.getElementById('cardUpgradeBtn').textContent = isTrialOrExpired ? "Buy Plan" : "Upgrade Plan";

      // 2. WhatsApp Usage
      document.getElementById('waUsed').textContent = data.usedCredits;
      document.getElementById('waRemaining').textContent = data.remainingCredits;
      const waPct = data.totalCredits > 0 ? (data.usedCredits / data.totalCredits) * 100 : 0;
      document.getElementById('waProgress').style.width = `${Math.min(waPct, 100)}%`;

      // 3. Customer Usage
      document.getElementById('custUsed').textContent = data.customersUsed;
      if (data.customerLimit) {
        document.getElementById('custRemaining').textContent = data.customersRemaining;
        const cPct = (data.customersUsed / data.customerLimit) * 100;
        document.getElementById('custProgress').style.width = `${Math.min(cPct, 100)}%`;
      } else {
        document.getElementById('custRemaining').textContent = "Unlimited";
        document.getElementById('custProgress').style.width = "0%";
      }
    }

    function setBillingCycle(cycle) {
      selectedCycle = cycle;
      
      if (cycle === 'yearly') {
        document.getElementById('toggleYearly').className = 'px-4 py-1.5 rounded-lg text-sm font-semibold bg-white text-gray-900 shadow-sm transition';
        document.getElementById('toggleHalfYearly').className = 'px-4 py-1.5 rounded-lg text-sm font-semibold text-gray-500 hover:text-gray-900 transition';
      } else {
        document.getElementById('toggleHalfYearly').className = 'px-4 py-1.5 rounded-lg text-sm font-semibold bg-white text-gray-900 shadow-sm transition';
        document.getElementById('toggleYearly').className = 'px-4 py-1.5 rounded-lg text-sm font-semibold text-gray-500 hover:text-gray-900 transition';
      }
      
      renderPlans();
    }

    function renderPlans() {
      const grid = document.getElementById('plansGrid');
      grid.innerHTML = '';
      
      const isTrialOrExpired = !currentPlanData.currentPlan || currentPlanData.currentPlan.isTrial || currentPlanData.status === 'Expired';
      const hasPaidPlan = currentPlanData.currentPlan && !currentPlanData.currentPlan.isTrial && currentPlanData.status === 'Active';

      const filteredPlans = globalPlans.filter(p => p.billingCycle === selectedCycle && (p.name.toLowerCase() === 'silver' || p.name.toLowerCase() === 'gold'));

      filteredPlans.forEach(plan => {
        const isCurrent = hasPaidPlan && currentPlanData.currentPlan.id === plan.id;
        
        let buttonHtml = '';
        if (isCurrent) {
          buttonHtml = `<button disabled class="w-full mt-5 py-2.5 rounded-xl bg-green-50 text-green-600 text-sm font-bold border border-green-200 cursor-not-allowed">
            Current Plan
          </button>`;
        } else {
          const btnText = isTrialOrExpired ? "Buy Plan" : "Upgrade Plan";
          buttonHtml = `<a href="/checkout.html?planId=${plan.id}" class="block text-center w-full mt-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold transition shadow-sm">
            ${btnText}
          </a>`;
        }

        const months = plan.billingCycle === 'half_yearly' ? '6 Months' : '12 Months';
        const price = plan.priceInr ? `₹${plan.priceInr.toLocaleString('en-IN')}` : 'Free';

        const card = document.createElement('div');
        card.className = `bg-white rounded-2xl p-5 shadow-sm transition flex flex-col h-full ${isCurrent ? 'border-2 border-green-500' : 'border border-gray-100 hover:border-indigo-200'}`;
        card.innerHTML = `
          <div class="mb-3 flex justify-between items-start">
            <div>
              <h4 class="text-lg font-bold text-gray-900">${plan.name}</h4>
              <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">${months}</p>
            </div>
            ${isCurrent ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-green-100 text-green-700 uppercase">Current</span>` : ''}
          </div>
          <div class="mb-5">
            <span class="text-2xl font-bold text-gray-900">${price}</span>
          </div>
          
          <div class="flex-grow space-y-3">
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              <p class="text-sm text-gray-600"><span class="font-semibold text-gray-900">${plan.customerLimit || 'Unlimited'}</span> Customers</p>
            </div>
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
              <p class="text-sm text-gray-600"><span class="font-semibold text-gray-900">${plan.whatsappCredits}</span> WhatsApp Credits</p>
            </div>
          </div>
          
          ${buttonHtml}
        `;
        grid.appendChild(card);
      });
      
      if (filteredPlans.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center py-8 text-sm text-gray-500 bg-white rounded-2xl border border-gray-100">No plans found for the selected billing cycle.</div>`;
      }
    }
  </script>
</body>
</html>
